<div class="empty-state">
  <div class="empty-icon">{{ icon }}</div>
  <h3 class="empty-title">{{ title }}</h3>
  <p class="empty-message">{{ message }}</p>
  <button
    *ngIf="actionText && actionClick"
    type="button"
    class="btn btn-primary"
    (click)="actionClick()"
  >
    {{ actionText }}
  </button>
</div>
