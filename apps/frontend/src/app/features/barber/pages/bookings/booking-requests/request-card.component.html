<article class="request-card">
  <div class="request-card__header">
    <div class="avatar">{{ initials }}</div>
    <div class="customer-info">
      <div class="customer-name">{{ customerName }}</div>
      <div class="customer-phone">{{ customerPhone }}</div>
    </div>
    <span class="status-pill" [ngClass]="'status-pill--' + (booking?.status?.toLowerCase() || 'default')">
      {{ booking?.status || 'Unknown' }}
    </span>
  </div>

  <div class="request-card__body">
    <div class="request-meta">
      <span class="meta-label">Services</span>
      <p>{{ serviceNames }}</p>
    </div>
    <div class="request-meta">
      <span class="meta-label">Preferred time</span>
      <p>{{ preferredTime }}</p>
    </div>
    <div class="request-meta">
      <span class="meta-label">Price</span>
      <p>{{ booking?.totalPrice | currency:'USD':'symbol':'1.0-0' }}</p>
    </div>
  </div>

  <div class="request-card__footer">
    <!-- PENDING: Accept / Reject -->
    <ng-container *ngIf="booking?.status === 'PENDING'">
      <button
        type="button"
        class="btn btn-accept"
        [disabled]="disabled"
        (click)="onAccept()"
      >
        ✓ Accept
      </button>
      <button
        type="button"
        class="btn btn-reject"
        [disabled]="disabled"
        (click)="onReject()"
      >
        ✗ Reject
      </button>
    </ng-container>

    <!-- ACCEPTED: Start Service / Reject -->
    <ng-container *ngIf="booking?.status === 'ACCEPTED'">
      <button
        type="button"
        class="btn btn-start"
        [disabled]="disabled"
        (click)="onStart()"
      >
        ▶ Start Service
      </button>
      <button
        type="button"
        class="btn btn-reject"
        [disabled]="disabled"
        (click)="onReject()"
      >
        ✗ Cancel
      </button>
    </ng-container>

    <!-- IN_PROGRESS: Complete Service -->
    <ng-container *ngIf="booking?.status === 'IN_PROGRESS'">
      <button
        type="button"
        class="btn btn-complete"
        [disabled]="disabled"
        (click)="onComplete()"
      >
        ✔ Complete Service
      </button>
    </ng-container>

    <!-- COMPLETED: Read-only -->
    <ng-container *ngIf="booking?.status === 'COMPLETED'">
      <span class="status-done-label">✅ Service Completed</span>
    </ng-container>

    <!-- REJECTED: Read-only -->
    <ng-container *ngIf="booking?.status === 'REJECTED'">
      <span class="status-rejected-label">❌ Request Rejected</span>
    </ng-container>
  </div>
</article>
