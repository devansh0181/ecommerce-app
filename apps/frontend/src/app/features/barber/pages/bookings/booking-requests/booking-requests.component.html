<section class="booking-requests-page">
  <div class="navigation-bar">
    <a routerLink="/barber/bookings" class="back-link">
      <span class="arrow">←</span> Back to Salons
    </a>
  </div>

  <div class="page-header">
    <div>
      <h1>Booking Requests</h1>
      <p class="page-copy">Manage incoming customer requests with fast accept / reject controls.</p>
    </div>

    <div class="page-actions">
      <div class="tab-list" role="tablist">
        <button
          *ngFor="let tab of statusTabs"
          type="button"
          class="tab-button"
          [class.tab-button--active]="selectedStatus === tab.value"
          (click)="switchTab(tab.value)"
        >
          {{ tab.label }}
        </button>
      </div>
      <button class="refresh-button" type="button" (click)="refresh()" [disabled]="loading">
        Refresh
      </button>
    </div>
  </div>

  <div class="summary-bar">
    <span class="summary-label">Showing</span>
    <strong>{{ filteredBookings.length }}</strong>
    <span class="summary-label">request(s)</span>
  </div>

  <div *ngIf="error" class="alert alert-error">
    <p>{{ error }}</p>
    <button class="btn btn-retry" type="button" (click)="loadRequests()">Try again</button>
  </div>

  <div *ngIf="loading" class="skeleton-grid">
    <div class="skeleton-card" *ngFor="let placeholder of [1, 2, 3, 4, 5, 6]"></div>
  </div>

  <div *ngIf="!loading && !filteredBookings.length && !error" class="empty-state">
    <h2>No booking requests yet</h2>
    <p>There are no requests matching this filter. Try refreshing or switching tabs.</p>
  </div>

  <div class="requests-grid" *ngIf="!loading && filteredBookings.length">
    <app-booking-request-card
      *ngFor="let booking of filteredBookings"
      [booking]="booking"
      [disabled]="actionPendingId === booking.id"
      (accept)="openAcceptDialog(booking)"
      (reject)="openRejectDialog(booking)"
    ></app-booking-request-card>
  </div>
</section>
