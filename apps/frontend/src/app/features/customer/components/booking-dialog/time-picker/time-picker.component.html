<div class="time-picker">
  <div class="header">
    <h3>Choose Your Preferred Time</h3>
    <p class="subtitle">Select a date and time</p>
  </div>

  <div class="form-group">
    <label for="datetime">Date & Time:</label>
    <input
      id="datetime"
      type="datetime-local"
      [value]="selectedDateTime"
      [min]="getMinDateTime()"
      (change)="onDateTimeChange($any($event.target).value)"
    />
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="salon" class="info">
    <p><strong>{{ salon.name }}</strong></p>
    <p class="hint">Salon is {{ salon.isOpen ? 'currently open' : 'currently closed' }}</p>
  </div>

  <div class="actions">
    <button class="btn-back" (click)="onBack()">Back</button>
    <button class="btn-next" (click)="onNext()" [disabled]="!selectedDateTime">Next</button>
  </div>
</div>
