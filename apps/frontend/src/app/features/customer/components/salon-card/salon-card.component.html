<article class="salon-card" role="button" tabindex="0" (click)="onSelect()" (keydown.enter)="onSelect()">
  <div class="image">
    <div class="placeholder">💈</div>
  </div>
  <div class="content">
    <h3 class="name">{{ salon.name }}</h3>
    <p class="address">{{ salon.address }}</p>
    <div class="meta">
      <div class="rating" aria-label="Rating: {{ salon.rating }}">
        <ng-container *ngFor="let _ of fullStars(salon.rating); let idx = index">
            <span class="star">★</span>
          </ng-container>
        <span class="rating-number">{{ salon.rating | number:'1.1-1' }}</span>
      </div>
      <div class="status" [class.open]="salon.isOpen" [class.closed]="!salon.isOpen">
        {{ salon.isOpen ? 'Open' : 'Closed' }}
      </div>
    </div>
  </div>
</article>
